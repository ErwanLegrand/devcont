[workspace]
members = [".", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[package]
name = "devcont"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Erwan Patrick Legrand <github@erwanlegrand.com>"]
description = "Runs Dev Containers from the command line or from CI."
license.workspace = true

[[bin]]
name = "devcont"
path = "src/main.rs"

[lib]
name = "devcont"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
shellexpand = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-five = "0.3"
directories = "6"
toml = "1.1"
colored = "3"
tinytemplate = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"
