[workspace]
members = [
    ".",
    "xtask"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Erwan Patrick Legrand <erwan.legrand@protonmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/erwanlegrand/rust-dev-template"
keywords = ["rust", "template", "development", "environment"]
categories = ["development-tools", "template"]

[workspace.dependencies]
# Core dependencies
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

# Testing
tokio = { version = "1.49", features = ["full"] }
proptest = "1.10"
criterion = "0.8"

# XTask dependencies
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
fs-err = "3.3"
duct = "1.1"
toml = "1.0"
regex = "1.12"
semver = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[package]
name = "rust-dev-template"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Complete Rust development environment with all essential tools"
readme = "README.md"

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
# Core dependencies - kept minimal for the example
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
# Testing utilities
proptest.workspace = true
criterion.workspace = true
